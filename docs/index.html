<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>株主総会 会場マップ</title>
<meta name="description" content="上場会社の株主総会がどこで開かれるかを地図で探せます。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23b8322a' stroke-width='10'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --paper: #f3f4f1;      /* 招集通知の用紙の白 */
    --ink: #1c2330;        /* 墨紺 */
    --ink-soft: #5a6272;
    --rule: #cfd3cc;
    --seal: #b8322a;       /* 朱肉 */
    --seal-wash: #f6e3e0;
    --past: #8d939c;
    --panel: #ffffff;
    --mincho: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --gothic: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--gothic);
    font-size: 15px;
    line-height: 1.6;
    display: grid;
    grid-template-columns: minmax(320px, 400px) 1fr;
    grid-template-rows: 100%;
    padding-top: env(safe-area-inset-top, 0px);
  }

  /* ---------- 左の一覧 ---------- */
  aside {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--rule);
    background: var(--paper);
  }
  header { padding: 22px 24px 14px; }
  h1 {
    font-family: var(--mincho);
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.08em;
    line-height: 1.3;
    margin: 0;
  }
  .lede { margin: 6px 0 0; color: var(--ink-soft); font-size: 13px; }

  .filters {
    padding: 12px 24px 16px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    display: grid;
    gap: 10px;
  }
  .filters input[type="search"], .filters input[type="date"] {
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 7px 9px;
    width: 100%;
    min-width: 0;
  }
  .range { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-soft); }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--seal); margin: 0; }
  .count { font-size: 13px; color: var(--ink-soft); }
  .count b { color: var(--ink); font-size: 15px; }

  #list { flex: 1; overflow-y: auto; padding: 0 0 24px; }
  .day {
    position: sticky; top: 0;
    background: var(--paper);
    font-family: var(--mincho);
    font-weight: 600;
    font-size: 16px;
    padding: 14px 24px 6px;
    border-bottom: 1px solid var(--rule);
    display: flex; justify-content: space-between; align-items: baseline;
    z-index: 1;
  }
  .day small { font-family: var(--gothic); font-size: 12px; color: var(--ink-soft); font-weight: 400; }
  .day.past { color: var(--past); }
  .item {
    display: block; width: 100%;
    text-align: left; font: inherit; color: inherit;
    background: none; border: 0; border-bottom: 1px solid #e3e5df;
    padding: 10px 24px 11px;
    cursor: pointer;
  }
  .item:hover { background: #eaece6; }
  .item:focus-visible { outline: 2px solid var(--seal); outline-offset: -2px; }
  .item .co { font-weight: 700; }
  .item .co span { font-weight: 400; color: var(--ink-soft); font-size: 12px; margin-left: 6px; }
  .item .meta { font-size: 13px; color: var(--ink-soft); }
  .empty { padding: 28px 24px; color: var(--ink-soft); font-size: 14px; }

  footer { padding: 10px 24px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--ink-soft); line-height: 1.55; }
  footer p { margin: 0 0 4px; }

  /* ---------- 地図 ---------- */
  main { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; background: #e8eae5; }

  /* 日付印のマーカー */
  .stamp-icon { background: none; border: 0; display: grid; place-items: center; }
  .stamp {
    width: 46px; height: 46px; border-radius: 50%;
    border: 2.5px solid var(--seal);
    background: rgba(255,255,255,0.92);
    color: var(--seal);
    display: grid; place-items: center;
    font-family: var(--mincho); font-weight: 800;
    font-size: 13px; line-height: 1;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.7);
    position: relative;
  }
  .stamp::before {           /* 日付印の内側の細い線 */
    content: ""; position: absolute; inset: 3px;
    border-radius: 50%; border: 1px solid currentColor; opacity: .45;
  }
  .stamp.past { color: var(--past); border-color: var(--past); }
  .stamp .n {
    position: absolute; right: -6px; top: -6px;
    min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 10px; background: var(--ink); color: #fff;
    font-family: var(--gothic); font-weight: 700; font-size: 11px;
    display: grid; place-items: center;
  }

  /* ポップアップ */
  .leaflet-popup-content-wrapper { border-radius: 4px; color: var(--ink); }
  .leaflet-popup-content { margin: 14px 16px; font-family: var(--gothic); font-size: 14px; line-height: 1.55; min-width: 230px; }
  .leaflet-popup-content p { margin: 0; }
  .pop-venue { font-family: var(--mincho); font-weight: 800; font-size: 16px; margin: 0 0 2px; }
  .pop-addr { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }
  .pop-row { border-top: 1px solid #e3e5df; padding: 7px 0 2px; }
  .pop-row .co { font-weight: 700; }
  .pop-row .co span { font-weight: 400; font-size: 12px; color: var(--ink-soft); margin-left: 4px; }
  .pop-row .when { color: var(--seal); font-weight: 700; }
  .pop-row .when.past { color: var(--past); }
  .pop-row a { color: var(--ink); font-size: 12.5px; }
  .pop-note { font-size: 11px; color: var(--ink-soft); margin-top: 6px; }

  /* 読み込みエラー時 */
  .loader {
    position: absolute; inset: 0; z-index: 1000;
    display: none; place-items: center;
    background: rgba(243,244,241,.94); padding: 24px;
  }
  .loader.show { display: grid; }
  .loader div { max-width: 420px; }
  .loader h2 { font-family: var(--mincho); margin: 0 0 8px; font-size: 20px; }
  .loader label { display: inline-block; margin-top: 10px; padding: 8px 14px; background: var(--ink); color: #fff; border-radius: 3px; cursor: pointer; }
  .loader input { display: none; }

  /* ---------- スマホ ---------- */
  @media (max-width: 760px) {
    /* スマホでは地図の下に一覧を並べ、ページ全体をスクロールさせる */
    html, body { height: auto; }
    body { display: flex; flex-direction: column; }
    main { order: -1; flex: none; height: 55vh; height: 55svh; }
    aside { border-right: 0; border-top: 1px solid var(--rule); }
    #list { overflow: visible; flex: none; }
    .stamp { width: 40px; height: 40px; font-size: 12px; }
    header { padding: 14px 18px 8px; }
    h1 { font-size: 21px; }
    .lede { display: none; }
    .filters { padding: 10px 18px 12px; }
    .day { padding: 12px 18px 5px; }
    .item { padding: 9px 18px 10px; }
    footer { padding-left: 18px; padding-right: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .leaflet-zoom-anim .leaflet-zoom-animated { transition: none !important; }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>株主総会 会場マップ</h1>
    <p class="lede">上場会社の株主総会が、いつ・どこで開かれるかを地図で探せます。</p>
  </header>

  <div class="filters">
    <input type="search" id="q" placeholder="会社名・証券コード・会場名で探す" aria-label="会社名・証券コード・会場名で探す">
    <div class="range">
      <input type="date" id="from" aria-label="開催日(から)">
      <span>〜</span>
      <input type="date" id="to" aria-label="開催日(まで)">
    </div>
    <label class="toggle"><input type="checkbox" id="upcoming" checked> これから開催される総会だけ表示</label>
    <div class="count" id="count" aria-live="polite"></div>
  </div>

  <div id="list"></div>

  <footer>
    <p>各社がTDnetで開示した資料から自動で抽出した情報です。日時や会場は変更されることがあるため、出席前に必ず各社の招集通知で確認してください。</p>
    <p id="updated"></p>
  </footer>
</aside>

<main>
  <div id="map" role="region" aria-label="株主総会の会場の地図"></div>
  <div class="loader" id="loader">
    <div>
      <h2>データを読み込めませんでした</h2>
      <p id="loader-msg">agm.geojson がこのページと同じフォルダにあるか確認してください。パソコン上でファイルを直接開いている場合は、下のボタンから agm.geojson を選ぶと表示できます。</p>
      <label>agm.geojson を選ぶ<input type="file" id="file" accept=".geojson,.json,application/geo+json,application/json"></label>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  "use strict";
  var DATA_URL = "agm.geojson";
  var WEEK = ["日", "月", "火", "水", "木", "金", "土"];

  // ---------- 地図 ----------
  var map = L.map("map", { zoomControl: true }).setView([35.68, 139.76], 11);
  L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>'
  }).addTo(map);
  var layer = L.layerGroup().addTo(map);

  var all = [];          // 全データ
  var markersByKey = {}; // 会場の座標 → マーカー
  var firstFit = true;

  // ---------- ユーティリティ ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function parseDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function today() {
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function fmtDay(d) {
    return (d.getMonth() + 1) + "月" + d.getDate() + "日(" + WEEK[d.getDay()] + ")";
  }
  function fmtWhen(r) {
    if (!r.date) return "開催日未確認";
    return r.date.getFullYear() + "年" + fmtDay(r.date) + " " + (r.time || "時刻未記載");
  }
  function half(s) {
    // 「Ｇ－ＣＲＡＶＩＡ」→「G-CRAVIA」のように全角英数字を半角にして表示
    return String(s || "").replace(/[Ａ-Ｚａ-ｚ０-９－]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    });
  }
  function isPast(r) { return r.date && r.date < today(); }
  function norm(s) {
    // 全角英数字を半角にして小文字化(「ＧＭＳ」でも「gms」でも検索できるように)
    return String(s || "").replace(/[Ａ-Ｚａ-ｚ０-９－]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    }).toLowerCase();
  }

  // ---------- データ読み込み ----------
  function load(geojson) {
    all = (geojson.features || []).filter(function (f) {
      return f.geometry && f.geometry.coordinates;
    }).map(function (f) {
      var p = f.properties || {};
      var c = f.geometry.coordinates;
      return {
        code: p.code, company: half(p.company),
        date: parseDate(p.meeting_date), dateStr: p.meeting_date || "",
        time: p.meeting_time, venue: p.venue_name, address: p.address,
        pdf: p.pdf_url, level: p.geocode_level,
        lat: c[1], lng: c[0],
        key: c[1].toFixed(5) + "," + c[0].toFixed(5),
        text: norm([p.code, p.company, p.venue_name, p.address].join(" "))
      };
    });
    document.getElementById("loader").classList.remove("show");
    var dates = all.map(function (r) { return r.dateStr; }).filter(Boolean).sort();
    if (dates.length) {
      document.getElementById("updated").textContent =
        "掲載 " + all.length + " 件(開催日 " + dates[0].replace(/-/g, "/") + " 〜 " + dates[dates.length - 1].replace(/-/g, "/") + ")。地図:国土地理院";
    }
    render();
  }

  function showLoadError() {
    document.getElementById("loader").classList.add("show");
  }

  fetch(DATA_URL, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(load)
    .catch(showLoadError);

  document.getElementById("file").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try { load(JSON.parse(reader.result)); }
      catch (err) { document.getElementById("loader-msg").textContent = "このファイルは読み込めませんでした。geocode_agm.py が出力した agm.geojson を選んでください。"; }
    };
    reader.readAsText(file, "utf-8");
  });

  // ---------- 絞り込み ----------
  var qEl = document.getElementById("q");
  var fromEl = document.getElementById("from");
  var toEl = document.getElementById("to");
  var upEl = document.getElementById("upcoming");
  [qEl, fromEl, toEl, upEl].forEach(function (el) {
    el.addEventListener(el === qEl ? "input" : "change", render);
  });

  function filtered() {
    var q = norm(qEl.value.trim());
    var from = parseDate(fromEl.value), to = parseDate(toEl.value);
    var t = today();
    return all.filter(function (r) {
      if (q && r.text.indexOf(q) === -1) return false;
      if (upEl.checked && r.date && r.date < t) return false;
      if (from && (!r.date || r.date < from)) return false;
      if (to && (!r.date || r.date > to)) return false;
      return true;
    }).sort(function (a, b) {
      return (a.dateStr || "9999").localeCompare(b.dateStr || "9999") ||
             (a.time || "99").localeCompare(b.time || "99");
    });
  }

  // ---------- 描画 ----------
  function render() {
    var rows = filtered();
    drawMarkers(rows);
    drawList(rows);
    var n = rows.length;
    var venues = Object.keys(markersByKey).length;
    document.getElementById("count").innerHTML = n
      ? "<b>" + n + "</b> 件の総会(会場 " + venues + " か所)"
      : "条件に合う総会はありません";
  }

  function popupHtml(group) {
    var head = group[0];
    var html = '<p class="pop-venue">' + esc(head.venue || "会場名未記載") + "</p>" +
               '<p class="pop-addr">' + esc(head.address) + "</p>";
    group.forEach(function (r) {
      html += '<div class="pop-row">' +
        '<div class="co">' + esc(r.company) + "<span>" + esc(r.code) + "</span></div>" +
        '<div class="when' + (isPast(r) ? " past" : "") + '">' + esc(fmtWhen(r)) + (isPast(r) ? "(終了)" : "") + "</div>" +
        (r.pdf ? '<a href="' + esc(r.pdf) + '" target="_blank" rel="noopener">開示資料を開く(PDF)</a>' : "") +
        "</div>";
    });
    if (group.some(function (r) { return r.level === "medium" || r.level === "low"; })) {
      html += '<p class="pop-note">地図上の位置は住所の街区までの目安です。</p>';
    }
    html += '<p class="pop-note">TDnetの資料は開示から約1か月で閲覧できなくなります。</p>';
    return html;
  }

  function drawMarkers(rows) {
    layer.clearLayers();
    markersByKey = {};
    var groups = {};
    rows.forEach(function (r) { (groups[r.key] = groups[r.key] || []).push(r); });

    Object.keys(groups).forEach(function (key) {
      var g = groups[key];
      var next = g.filter(function (r) { return !isPast(r); })[0];
      var head = next || g[0];
      var label = head.date ? (head.date.getMonth() + 1) + "/" + head.date.getDate() : "未定";
      var icon = L.divIcon({
        className: "stamp-icon",
        iconSize: [46, 46], iconAnchor: [23, 23], popupAnchor: [0, -22],
        html: '<div class="stamp' + (next ? "" : " past") + '"><span>' + esc(label) + "</span>" +
              (g.length > 1 ? '<span class="n">' + g.length + "</span>" : "") + "</div>"
      });
      var m = L.marker([head.lat, head.lng], {
        icon: icon,
        title: g.map(function (r) { return r.company; }).join("、"),
        keyboard: true,
        zIndexOffset: next ? 1000 : 0
      }).bindPopup(popupHtml(g), { maxWidth: 300, autoPanPadding: [20, 20] });
      m.addTo(layer);
      markersByKey[key] = m;
    });

    if (firstFit && rows.length) {
      firstFit = false;
      var b = L.latLngBounds(rows.map(function (r) { return [r.lat, r.lng]; }));
      map.fitBounds(b, { padding: [40, 40], maxZoom: 14 });
    }
  }

  function drawList(rows) {
    var list = document.getElementById("list");
    if (!rows.length) {
      list.innerHTML = '<div class="empty">条件に合う総会がありません。日付の範囲を広げるか、「これから開催される総会だけ表示」を外してみてください。</div>';
      return;
    }
    var html = "", lastDay = null;
    rows.forEach(function (r, i) {
      var day = r.dateStr || "unknown";
      if (day !== lastDay) {
        var cnt = rows.filter(function (x) { return (x.dateStr || "unknown") === day; }).length;
        html += '<div class="day' + (isPast(r) ? " past" : "") + '">' +
                (r.date ? fmtDay(r.date) : "開催日未確認") + "<small>" + cnt + " 件</small></div>";
        lastDay = day;
      }
      html += '<button type="button" class="item" data-i="' + i + '">' +
        '<div class="co">' + esc(r.company) + "<span>" + esc(r.code) + "</span></div>" +
        '<div class="meta">' + esc(r.time || "時刻未記載") + " ・ " + esc(r.venue || "会場名未記載") + "</div>" +
        "</button>";
    });
    list.innerHTML = html;
    list.querySelectorAll(".item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var r = rows[+btn.getAttribute("data-i")];
        var m = markersByKey[r.key];
        if (!m) return;
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce) map.setView([r.lat, r.lng], 16);
        else map.flyTo([r.lat, r.lng], 16, { duration: 0.6 });
        setTimeout(function () { m.openPopup(); }, reduce ? 0 : 650);
        if (window.innerWidth <= 760) window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      });
    });
  }
})();
</script>
</body>
</html>
